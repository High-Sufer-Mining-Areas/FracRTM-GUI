[build-system]
requires = ["setuptools>=77.0.3,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "fracrtm-gui"
dynamic = ["version"]
description = "Desktop workflow for DFN geometry, continuum mapping, and PFLOTRAN modelling"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
  "PyQt5>=5.15.11,<5.16",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "h5py>=3.10,<4",
  "pyvista>=0.46,<0.50",
  "pyvistaqt>=0.11,<0.14",
  "vtk>=9.3,<9.8",
]

[project.scripts]
fracrtm-gui = "fracrtm.app:main"

[tool.setuptools.dynamic]
version = {attr = "fracrtm.version.__version__"}

[tool.setuptools.packages.find]
include = ["fracrtm*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
fracrtm = ["locales/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fracrtm"]

[tool.ruff.format]
line-ending = "lf"
